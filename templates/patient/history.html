<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient History - HMS</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --success-color: #27ae60;
            --danger-color: #e74c3c;
            --light-bg: #f4f7f6;
            --white: #ffffff;
            --border-radius: 8px;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--light-bg);
            color: #333;
            padding: 20px;
        }

        /* Simulation Controls (Remove in production) */
        .dev-controls {
            background: #ffeb3b;
            padding: 10px;
            text-align: center;
            margin-bottom: 20px;
            border-radius: var(--border-radius);
            font-weight: bold;
        }

        /* Layout Containers */
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .btn-back {
            background: transparent;
            border: 1px solid #ccc;
            padding: 5px 15px;
            border-radius: 4px;
            cursor: pointer;
            color: #666;
        }

        /* Patient Card (Top Section) */
        .patient-card {
            background: var(--white);
            padding: 20px;
            border-radius: var(--border-radius);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            display: flex;
            gap: 20px;
            align-items: center;
            margin-bottom: 30px;
            border-left: 5px solid var(--accent-color);
        }

        .patient-avatar {
            width: 80px;
            height: 80px;
            background-color: #e0e0e0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: #777;
        }

        .patient-info h2 {
            margin-bottom: 5px;
            color: var(--primary-color);
        }

        .patient-details-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px 30px;
            font-size: 0.9rem;
            color: #555;
            margin-top: 5px;
        }

        .patient-details-grid strong {
            color: var(--primary-color);
        }

        /* History Table Section */
        .history-section {
            background: var(--white);
            padding: 20px;
            border-radius: var(--border-radius);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }

        .btn-add {
            background-color: var(--success-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: var(--border-radius);
            cursor: pointer;
            display: none;
            /* Hidden by default */
        }

        .btn-add:hover {
            background-color: #219150;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            text-align: left;
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
        }

        th {
            background-color: #f8f9fa;
            color: var(--primary-color);
            font-weight: 600;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .badge-ipd {
            background: #e3f2fd;
            color: #1976d2;
        }

        /* In-Patient */
        .badge-opd {
            background: #e8f5e9;
            color: #388e3c;
        }

        /* Out-Patient */

        /* Action Buttons */
        .action-btn {
            padding: 5px 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            margin-right: 5px;
        }

        .btn-view {
            background: var(--accent-color);
            color: white;
        }

        .btn-edit {
            background: #f39c12;
            color: white;
            display: none;
        }

        /* Modal for Viewing/Adding (Simplified) */
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .modal-content {
            background-color: #fefefe;
            margin: 10% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 50%;
            border-radius: var(--border-radius);
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .patient-details-grid {
                grid-template-columns: 1fr;
            }

            .modal-content {
                width: 90%;
            }
        }
    </style>
</head>

<body>

    <div class="dev-controls">
        Current View:
        <select id="roleSwitcher" onchange="updateView()">
            <option value="patient">Patient View</option>
            <option value="doctor">Doctor View</option>
            <option value="admin">Admin View</option>
        </select>
    </div>

    <div class="container">

        <div class="header-section">
            <button class="btn-back">← Back to Dashboard</button>
            <h3>Medical History Records</h3>
        </div>

        <div class="patient-card">
            <div class="patient-avatar">👤</div>
            <div class="patient-info">
                <h2 id="pName">Mr. Alex Johnson</h2>
                <div class="patient-details-grid">
                    <span><strong>Age:</strong> 34 Years</span>
                    <span><strong>Blood Type:</strong> O+</span>
                    <span><strong>Card No:</strong> HMS-9920</span>
                    <span><strong>Phone:</strong> +91 98765 43210</span>
                    <span><strong>Last Visit:</strong> 24 Oct 2024</span>
                    <span><strong>Status:</strong> Active</span>
                </div>
            </div>
        </div>

        <div class="history-section">
            <div class="section-header">
                <h3>Past Consultations</h3>
                <button class="btn-add" id="addRecordBtn" onclick="openModal()">+ Update Patient History</button>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Visit No.</th>
                        <th>Type</th>
                        <th>Doctor / Dept</th>
                        <th>Diagnosis</th>
                        <th>Prescription</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="historyTableBody">
                </tbody>
            </table>
        </div>
    </div>

    <div id="historyModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2 style="margin-bottom: 20px;">Update Patient History</h2>
            <form>
                <div style="margin-bottom: 15px;">
                    <label style="display:block; margin-bottom:5px;">Diagnosis</label>
                    <input type="text" style="width:100%; padding: 8px;" placeholder="e.g. Viral Fever">
                </div>
                <div style="margin-bottom: 15px;">
                    <label style="display:block; margin-bottom:5px;">Prescription / Medicines</label>
                    <textarea style="width:100%; padding: 8px; height: 80px;"
                        placeholder="e.g. Paracetamol 500mg"></textarea>
                </div>
                <div style="margin-bottom: 15px;">
                    <label style="display:block; margin-bottom:5px;">Tests Required</label>
                    <input type="text" style="width:100%; padding: 8px;" placeholder="e.g. CBC, X-Ray">
                </div>
                <button type="button" class="btn-add" style="display:inline-block;" onclick="closeModal()">Save
                    Record</button>
            </form>
        </div>
    </div>

    <script>
        // 1. Mock Data based on Wireframe columns
        const historyData = [
            { date: '2024-10-24', visitId: '1002', type: 'OPD', doctor: 'Dr. Smith (Cardiology)', diagnosis: 'Mild Hypertension', prescription: 'Atenolol 50mg', tests: 'ECG' },
            { date: '2024-09-15', visitId: '0988', type: 'IPD', doctor: 'Dr. Adams (Orthopedic)', diagnosis: 'Fracture - Right Arm', prescription: 'Painkillers, Plaster', tests: 'X-Ray' },
            { date: '2024-05-10', visitId: '0850', type: 'OPD', doctor: 'Dr. Sarah (General)', diagnosis: 'Viral Infection', prescription: 'Antibiotics', tests: 'Blood Test' }
        ];

        // 2. Render Table Function
        function renderTable(role) {
            const tbody = document.getElementById('historyTableBody');
            tbody.innerHTML = '';

            historyData.forEach(item => {
                const row = document.createElement('tr');

                // Determine Badge Class
                const badgeClass = item.type === 'IPD' ? 'badge-ipd' : 'badge-opd';

                // Determine Actions based on Role
                let actionButtons = `<button class="action-btn btn-view">View</button>`;

                // Doctors and Admins can Edit
                if (role === 'doctor' || role === 'admin') {
                    actionButtons += `<button class="action-btn btn-edit" style="display:inline-block">Edit</button>`;
                }

                // Admins might have delete (optional, not adding to keep it clean)

                row.innerHTML = `
                    <td>${item.date}</td>
                    <td>#${item.visitId}</td>
                    <td><span class="badge ${badgeClass}">${item.type}</span></td>
                    <td>${item.doctor}</td>
                    <td>${item.diagnosis}</td>
                    <td>${item.prescription}</td>
                    <td>${actionButtons}</td>
                `;
                tbody.appendChild(row);
            });
        }

        // 3. View Switcher Logic (Simulating Role-Based Access)
        function updateView() {
            const role = document.getElementById('roleSwitcher').value;
            const addBtn = document.getElementById('addRecordBtn');

            // Render the table with specific role permissions
            renderTable(role);

            // Show "Update Patient History" button ONLY for Doctors
            if (role === 'doctor') {
                addBtn.style.display = 'block';
                addBtn.innerText = "+ Add New Diagnosis";
            } else if (role === 'admin') {
                addBtn.style.display = 'block'; // Admins usually can add/edit too
                addBtn.innerText = "+ Add Record (Admin)";
            } else {
                addBtn.style.display = 'none'; // Patients cannot add history
            }
        }

        // 4. Modal Logic
        const modal = document.getElementById("historyModal");
        function openModal() { modal.style.display = "block"; }
        function closeModal() { modal.style.display = "none"; }
        window.onclick = function (event) {
            if (event.target == modal) { closeModal(); }
        }

        // Initial Load
        updateView(); // Defaults to Patient view
    </script>
</body>

</html>
