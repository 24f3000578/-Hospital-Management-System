<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>{{ doctor.name }} - Availability</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-4">
        <a href="{{ url_for('pat_dashboard') }}" class="btn btn-link">&larr; Back to Dashboard</a>

        <div class="card mt-2">
            <div class="card-header">
                <h5 class="mb-0">Availability - {{ doctor.name }}</h5>
            </div>
            <div class="card-body">
                {% if slots %}
                <table class="table">
                    <thead>
                        <tr>
                            <th scope="col">Date</th>
                            <th scope="col">Time Slot</th>
                            <th scope="col" class="text-end">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for s in slots %}
                        <tr>
                            <td>{{ s.date }}</td>
                            <td>{{ s.start_time.strftime("%I:%M %p") }} - {{ s.end_time.strftime("%I:%M %p") }}</td>
                            <td class="text-end">
                                <form action="{{ url_for('book_appointment', availability_id=s.id) }}" method="POST" class="d-inline">
                                    <button type="submit" class="btn btn-sm btn-success">
                                        Book
                                    </button>
                                </form>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
                {% else %}
                <p class="text-muted mb-0">No available slots found for this doctor.</p>
                {% endif %}
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
